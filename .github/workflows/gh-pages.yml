#*******************************************************************************
#  gh-pages.yml
#
#  Github Workflow to deploy Interlisp.org.
#
#  Interlisp.org is a Hugo based static website that contains a 
#  detailed bibliography maintained using Zotero (https://www.zotero.org/groups/2914042/interlispwww.zotero.org/).
#
#  This workflow consists of several jobs:
#
#     validate-docs  - ensure README.md references the correct Hugo version
#     hugo-version   - expose the Hugo version as a job output
#     build          - build the website and run the full test suite using the
#                      org-level reusable workflow; also checks the Zotero
#                      bibliography version (skipping the build on scheduled
#                      runs when it is unchanged)
#                      (Interlisp/shared-workflows/.github/workflows/build-site.yml)
#     preview        - trigger a per-PR staging preview in
#                      Interlisp/Interlisp.staging (skips on fork PRs or when
#                      the STAGING_APP_ID variable is unset)
#     deploy         - deploy the built site to GitHub Pages
#     notify         - email ci_failures@interlisp.org on any failure or
#                      build warnings (notify-only; warnings still deploy)
#
#  The workflow is executed either on a push or via scheduled run times.  When
#  started at a scheduled run time we only do a deploy if the cached bibliography
#  is no longer current.  On a push, we always verify the the current
#  bibliography is loaded and deploy a new version of the website.
#
#  2023-10-20 Bill Stumbo
#
# Copyright 2023 by Interlisp.org
#
# ******************************************************************************
name: github pages

on:
  push:
    branches:
      - main  # Set a branch to deploy

  pull_request:
    branches:
      - main

  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

defaults:
    run:
        shell: bash

env:
  # ----------------------------------------------------------------------------
  # Specify the deployment environment:  staging or production
  HUGO_ENVIRONMENT: ${{ vars.HUGO_ENVIRONMENT || 'staging' }}
  HUGO_VERSION: 0.157.0

jobs:
  # ----------------------------------------------------------------------------
  # Validate that README.md references the correct Hugo version.
  # Only runs on push/pull_request, not scheduled runs.
  #
  validate-docs:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check Hugo version consistency
        run: |
          echo "Checking README.md for Hugo version $HUGO_VERSION"
          
          # Check badge
          if ! grep -q "badge/Hugo-${HUGO_VERSION}" README.md; then
            echo "::error::README.md badge does not reference Hugo version $HUGO_VERSION"
            FAILED=1
          fi
          
          # Check download URL
          if ! grep -q "hugo_extended_${HUGO_VERSION}_linux-amd64.deb" README.md; then
            echo "::error::README.md download URL does not reference Hugo version $HUGO_VERSION"
            FAILED=1
          fi
          
          if [ "$FAILED" = "1" ]; then
            echo "Update README.md to use Hugo version $HUGO_VERSION"
            exit 1
          fi
          
          echo "README.md Hugo version references are consistent"

  # ----------------------------------------------------------------------------
  # Expose the Hugo version from the workflow environment as a job output.
  # The env context is not available in a reusable workflow's `with:` block,
  # so the version is surfaced here instead.  Keeping it in the workflow `env`
  # means version bumps are ordinary, reviewed pull requests.
  #
  hugo-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ env.HUGO_VERSION }}
    steps:
      - name: Verify Hugo version is set
        env:
          VERSION: ${{ env.HUGO_VERSION }}
        run: |
          [[ -n "$VERSION" ]] || { echo "::error::HUGO_VERSION is empty"; exit 1; }
          echo "Hugo version: $VERSION"

  # ----------------------------------------------------------------------------
  # Build the website using the org-level reusable workflow.  This job is
  # conditional, we will always run it on a push or if on a scheduled run the
  # cache was determined to be out of date.
  #
  build:
    needs: [validate-docs, hugo-version]
    if: always() && (needs.validate-docs.result == 'success' || needs.validate-docs.result == 'skipped') && (needs.hugo-version.result == 'success')
    uses: Interlisp/shared-workflows/.github/workflows/build-site.yml@main
    with:
      hugo-version: ${{ needs.hugo-version.outputs.version }}
      hugo-environment: ${{ vars.HUGO_ENVIRONMENT || 'production' }}
      skip-if-fresh: ${{ github.event_name == 'schedule' }}

  # ----------------------------------------------------------------------------
  # Trigger a per-PR staging preview in Interlisp/Interlisp.staging.  Skips on
  # fork pull requests and when the GitHub App credentials are not configured,
  # so the workflow remains green during rollout.  The Hugo version is passed
  # as a dispatch input (a step can read the env context, unlike a reusable
  # workflow call), keeping gh-pages.yml's env the single source of truth.
  #
  preview:
    if: github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        vars.STAGING_APP_ID != ''
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.STAGING_APP_ID }}
          private-key: ${{ secrets.STAGING_APP_PRIVATE_KEY }}
          owner: Interlisp
          repositories: |
            Interlisp.staging

      - name: Trigger staging preview
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: deploy-preview.yml
          repo: Interlisp/Interlisp.staging
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          inputs: >-
            {
              "pr_number": "${{ github.event.pull_request.number }}",
              "pr_sha": "${{ github.event.pull_request.head.sha }}",
              "hugo_version": "${{ env.HUGO_VERSION }}"
            }

  # ----------------------------------------------------------------------------
  # Deploy the built site to GitHub Pages.
  # Only runs on push or scheduled runs, never on pull requests, and never
  # when the build was skipped because the bibliography was already current.
  #
  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.skipped != 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ----------------------------------------------------------------------------
  # Notify ci_failures@interlisp.org when the workflow fails or produces
  # warnings.  GitHub does not notify on workflow failure by default, so
  # without this job a broken nightly build can go undetected for days.
  #
  # Triggers on:
  #   - any job failure (validate-docs, hugo-version, build, preview, deploy)
  #   - warnings surfaced by the shared build workflow
  #     (needs.build.outputs.has-warnings == 'true'; see
  #     Interlisp/shared-workflows build-site.yml proposal)
  #
  # Warnings are notify-only: the build still passes and deploys.
  #
  # Required secrets (set in repo or org Settings > Secrets > Actions):
  #   MAIL_SERVER    e.g. smtp.gmail.com
  #   MAIL_USERNAME  SMTP login (also used as default From address)
  #   MAIL_PASSWORD  SMTP password (Gmail: use an App password)
  # Optional vars (Settings > Variables > Actions):
  #   MAIL_PORT      default 587 (STARTTLS)
  #   MAIL_FROM      default is MAIL_USERNAME
  #                  e.g. "Interlisp CI <ci@interlisp.org>"
  #   MAIL_TO        default ci_failures@interlisp.org
  #
  notify:
    if: always() && (needs.validate-docs.result == 'failure' || needs.hugo-version.result == 'failure' || needs.build.result == 'failure' || needs.preview.result == 'failure' || needs.deploy.result == 'failure' || needs.build.outputs.has-warnings == 'true')
    runs-on: ubuntu-latest
    needs: [validate-docs, hugo-version, build, preview, deploy]
    steps:
      - name: Check mail secrets configured
        id: mail-check
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          if [[ -z "$MAIL_SERVER" || -z "$MAIL_USERNAME" || -z "$MAIL_PASSWORD" ]]; then
            echo "::warning::Mail secrets (MAIL_SERVER/MAIL_USERNAME/MAIL_PASSWORD) not configured; skipping email to ci_failures@interlisp.org"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send failure email
        if: steps.mail-check.outputs.configured == 'true' && (needs.validate-docs.result == 'failure' || needs.hugo-version.result == 'failure' || needs.build.result == 'failure' || needs.preview.result == 'failure' || needs.deploy.result == 'failure')
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ vars.MAIL_PORT || '587' }}
          secure: false
          require_tls: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[${{ github.repository }} CI] FAILED: ${{ github.workflow }} run ${{ github.run_number }} (${{ github.event_name }}, ${{ github.ref_name }})"
          to: ${{ vars.MAIL_TO || 'ci_failures@interlisp.org' }}
          from: ${{ vars.MAIL_FROM || secrets.MAIL_USERNAME }}
          body: |
            CI workflow FAILED for ${{ github.repository }}.

            Workflow: ${{ github.workflow }}
            Event: ${{ github.event_name }}
            Ref: ${{ github.ref }} (${{ github.ref_name }})
            SHA: ${{ github.sha }}
            Actor: ${{ github.actor }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Job results:
              validate-docs: ${{ needs.validate-docs.result }}
              hugo-version: ${{ needs.hugo-version.result }}
              build: ${{ needs.build.result }} (skipped=${{ needs.build.outputs.skipped }}, has-warnings=${{ needs.build.outputs.has-warnings }})
              preview: ${{ needs.preview.result }}
              deploy: ${{ needs.deploy.result }}

            Please review the failed run logs at the URL above.

      - name: Send warnings email
        if: steps.mail-check.outputs.configured == 'true' && needs.validate-docs.result != 'failure' && needs.hugo-version.result != 'failure' && needs.build.result != 'failure' && needs.preview.result != 'failure' && needs.deploy.result != 'failure' && needs.build.outputs.has-warnings == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ vars.MAIL_PORT || '587' }}
          secure: false
          require_tls: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[${{ github.repository }} CI] WARNINGS: ${{ github.workflow }} run ${{ github.run_number }} (${{ github.event_name }}, ${{ github.ref_name }})"
          to: ${{ vars.MAIL_TO || 'ci_failures@interlisp.org' }}
          from: ${{ vars.MAIL_FROM || secrets.MAIL_USERNAME }}
          body: |
            CI workflow completed with WARNINGS for ${{ github.repository }} (build passed, deploy continued).

            Workflow: ${{ github.workflow }}
            Event: ${{ github.event_name }}
            Ref: ${{ github.ref }} (${{ github.ref_name }})
            SHA: ${{ github.sha }}
            Actor: ${{ github.actor }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Warnings summary: ${{ needs.build.outputs.warnings-summary }}

            Job results:
              validate-docs: ${{ needs.validate-docs.result }}
              hugo-version: ${{ needs.hugo-version.result }}
              build: ${{ needs.build.result }} (skipped=${{ needs.build.outputs.skipped }}, has-warnings=${{ needs.build.outputs.has-warnings }})
              preview: ${{ needs.preview.result }}
              deploy: ${{ needs.deploy.result }}

            Please review the warnings in the run logs at the URL above.
