#*******************************************************************************
#  preview-cleanup.yml
#
#  GitHub Workflow that removes the staging preview for a pull request once
#  the pull request is closed or merged.
#
#  Triggers the remove-preview workflow in the Interlisp/Interlisp.staging
#  repository, which deletes the pr-<N>/ subdirectory from the staging
#  Pages site.
#
#  Copyright 2026 by Interlisp.org
#
# ******************************************************************************
name: Preview Cleanup

on:
  pull_request:
    branches:
      - main
    types: [closed]

jobs:
  remove-preview:
    if: vars.STAGING_APP_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.STAGING_APP_ID }}
          private-key: ${{ secrets.STAGING_APP_PRIVATE_KEY }}
          owner: Interlisp
          repositories: |
            Interlisp.staging

      - name: Trigger staging preview removal
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: remove-preview.yml
          repo: Interlisp/Interlisp.staging
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          inputs: '{"pr_number":"${{ github.event.pull_request.number }}"}'

  # Notify ci_failures@interlisp.org if preview cleanup fails.  Uses the
  # same MAIL_* secrets/vars as gh-pages.yml; skips gracefully when they
  # are not configured.
  notify:
    if: always() && needs.remove-preview.result == 'failure'
    runs-on: ubuntu-latest
    needs: [remove-preview]
    steps:
      - name: Check mail secrets configured
        id: mail-check
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          if [[ -z "$MAIL_SERVER" || -z "$MAIL_USERNAME" || -z "$MAIL_PASSWORD" ]]; then
            echo "::warning::Mail secrets (MAIL_SERVER/MAIL_USERNAME/MAIL_PASSWORD) not configured; skipping email to ci_failures@interlisp.org"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send failure email
        if: steps.mail-check.outputs.configured == 'true'
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ vars.MAIL_PORT || '587' }}
          secure: false
          require_tls: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[${{ github.repository }} CI] FAILED: ${{ github.workflow }} run ${{ github.run_number }} (PR #${{ github.event.pull_request.number }})"
          to: ${{ vars.MAIL_TO || 'ci_failures@interlisp.org' }}
          from: ${{ vars.MAIL_FROM || secrets.MAIL_USERNAME }}
          body: |
            Preview cleanup FAILED for ${{ github.repository }}.

            Workflow: ${{ github.workflow }}
            PR: #${{ github.event.pull_request.number }}
            Ref: ${{ github.ref }} (${{ github.ref_name }})
            SHA: ${{ github.sha }}
            Actor: ${{ github.actor }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Job results:
              remove-preview: ${{ needs.remove-preview.result }}

            Please review the failed run logs at the URL above.
